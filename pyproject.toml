[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pantheon-sim"
version = "0.0.1"
description = "CPU reference prototype for PANTHEON multi-agent simulation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pantheon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
